name: Build and Deploy to Hostinger via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_SFTP_PRIVATE_KEY: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
      HOSTINGER_SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: CI=false npm run build

      - name: Ensure build contains .htaccess
        run: |
          if [ ! -f build/.htaccess ]; then echo "ERROR: build/.htaccess missing"; exit 1; fi

      - name: Validate Hostinger credentials
        run: |
          if [ -z "$HOSTINGER_SFTP_PRIVATE_KEY" ] && [ -z "$HOSTINGER_SFTP_PASSWORD" ]; then
            echo "::error::Set HOSTINGER_SFTP_PRIVATE_KEY or HOSTINGER_SFTP_PASSWORD in GitHub Actions secrets."
            exit 1
          fi

      - name: Detect build bundle filename
        id: bundle
        run: |
          BUNDLE=$(basename $(find build/static/js -maxdepth 1 -name 'main.*.js' | head -n1))
          if [ -z "$BUNDLE" ]; then
            echo "::error::Could not detect main JS bundle in build/static/js"
            exit 1
          fi
          echo "Detected bundle: $BUNDLE"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Backup remote target (SSH)
        if: ${{ env.HOSTINGER_SFTP_PRIVATE_KEY != '' || env.HOSTINGER_SFTP_PASSWORD != '' }}
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
          script: |
            set -e
            TARGET=${{ secrets.HOSTINGER_SFTP_TARGET }}
            if [ -z "$TARGET" ] || [ "$TARGET" = "/" ] || [ "$TARGET" = "." ] || [ "$TARGET" = ".." ]; then
              echo "Refusing to operate on unsafe HOSTINGER_SFTP_TARGET: '$TARGET'"
              exit 1
            fi
            BACKUP="${TARGET%/}.deploy_backup"
            echo "Removing any stale backup at $BACKUP"
            rm -rf "$BACKUP"
            if [ -d "$TARGET" ]; then
              echo "Backing up current $TARGET to $BACKUP"
              mv "$TARGET" "$BACKUP"
            fi
            mkdir -p "$TARGET"

      - name: Upload build via SCP
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
          source: "build/"
          target: ${{ secrets.HOSTINGER_SFTP_TARGET }}
          strip_components: 1

      - name: Verify deployment and remove backup (SSH)
        if: ${{ success() && (env.HOSTINGER_SFTP_PRIVATE_KEY != '' || env.HOSTINGER_SFTP_PASSWORD != '') }}
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
          script: |
            set -e
            TARGET=${{ secrets.HOSTINGER_SFTP_TARGET }}
            BUNDLE="${{ steps.bundle.outputs.bundle }}"
            if [ -z "$TARGET" ] || [ "$TARGET" = "/" ] || [ "$TARGET" = "." ] || [ "$TARGET" = ".." ]; then
              echo "Refusing to operate on unsafe HOSTINGER_SFTP_TARGET: '$TARGET'"
              exit 1
            fi
            if [ ! -f "$TARGET/index.html" ]; then
              echo "Deployment verification failed: index.html missing in $TARGET"
              exit 1
            fi
            if [ ! -f "$TARGET/static/js/$BUNDLE" ]; then
              echo "Deployment verification failed: expected bundle $BUNDLE missing in $TARGET/static/js"
              exit 1
            fi
            if ! grep -q "$BUNDLE" "$TARGET/index.html"; then
              echo "Deployment verification failed: index.html does not reference $BUNDLE"
              exit 1
            fi
            echo "Deployment verified (index.html + $BUNDLE present and referenced), removing backup"
            rm -rf "${TARGET%/}.deploy_backup"

      - name: Rollback on failure (SSH)
        if: ${{ failure() && (env.HOSTINGER_SFTP_PRIVATE_KEY != '' || env.HOSTINGER_SFTP_PASSWORD != '') }}
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SFTP_HOST }}
          username: ${{ secrets.HOSTINGER_SFTP_USERNAME }}
          key: ${{ secrets.HOSTINGER_SFTP_PRIVATE_KEY }}
          password: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SFTP_PORT || '22' }}
          script: |
            set -e
            TARGET=${{ secrets.HOSTINGER_SFTP_TARGET }}
            if [ -z "$TARGET" ] || [ "$TARGET" = "/" ] || [ "$TARGET" = "." ] || [ "$TARGET" = ".." ]; then
              echo "Refusing to operate on unsafe HOSTINGER_SFTP_TARGET: '$TARGET'"
              exit 1
            fi
            BACKUP="${TARGET%/}.deploy_backup"
            if [ -d "$BACKUP" ]; then
              echo "Rolling back: restoring $BACKUP to $TARGET"
              rm -rf "$TARGET"
              mv "$BACKUP" "$TARGET"
            else
              echo "No backup found to restore"
            fi
